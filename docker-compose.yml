services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-editorial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-editorial}
      POSTGRES_DB: ${POSTGRES_DB:-editorial} 
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-editorial} -d ${POSTGRES_DB:-editorial}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-editorial}:${POSTGRES_PASSWORD:-editorial}@db:5432/${POSTGRES_DB:-editorial}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-admin}
      - N8N_HOST=localhost
      - N8N_PORT=5678
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows

volumes:
  pgdata:
  n8ndata:
